<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>conversation-copilot</title>
  <script>
    document.documentElement.dataset.theme = localStorage.getItem("overlay-theme") === "white" ? "white" : "black";
  </script>
  <style>
    :root, [data-theme="black"] {
      --bg: rgba(28, 28, 30, 0.86);
      --line: rgba(255, 255, 255, 0.1);
      --muted: #98989d;
      --text: #f5f5f7;
      --title: #f5f5f7;
      --input: #1c1c1e;
      --card: #2c2c2e;
      --card-current: #3a3a3c;
      --accent: #0a84ff;
      --ok: #30d158;
      --ext: #64d2ff;
      --hairline: rgba(255, 255, 255, 0.1);
      --chip: rgba(255, 255, 255, 0.08);
      --btn: rgba(255, 255, 255, 0.08);
      --label: #98989d;
      --draft: #d1d1d6;
      --save-fg: #fff;
      --shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    }
    [data-theme="white"] {
      --bg: rgba(246, 246, 247, 0.92);
      --line: rgba(0, 0, 0, 0.08);
      --muted: #6e6e73;
      --text: #1d1d1f;
      --title: #1d1d1f;
      --input: #ffffff;
      --card: #ffffff;
      --card-current: #ffffff;
      --accent: #007aff;
      --ok: #34c759;
      --ext: #007aff;
      --hairline: rgba(0, 0, 0, 0.08);
      --chip: rgba(0, 0, 0, 0.06);
      --btn: rgba(0, 0, 0, 0.05);
      --label: #6e6e73;
      --draft: #6e6e73;
      --save-fg: #fff;
      --shadow: 0 10px 32px rgba(0, 0, 0, 0.12);
    }
    html, body {
      margin: 0;
      height: 100%;
      background: transparent;
      color: var(--text);
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      overflow: hidden;
    }
    .wrap {
      box-sizing: border-box;
      height: 100%;
      padding: 10px;
      display: flex;
      flex-direction: column;
    }
    .panel {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 14px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      min-height: 0;
      flex: 1;
      overflow: hidden;
    }
    .body {
      position: relative;
      display: flex;
      flex-direction: row;
      min-height: 0;
      flex: 1;
    }
    .main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      flex: 1;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px 8px;
      border-bottom: 1px solid var(--line);
      -webkit-app-region: drag;
    }
    .hdr-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    header strong {
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--title);
    }
    .hdr-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      -webkit-app-region: no-drag;
    }
    .icon-btn {
      appearance: none;
      background: var(--btn);
      border: 1px solid var(--line);
      color: var(--muted);
      border-radius: 8px;
      width: 26px;
      height: 26px;
      font: 13px/1 inherit;
      cursor: pointer;
      padding: 0;
    }
    .icon-btn:hover, .icon-btn.on { color: var(--text); background: rgba(255, 255, 255, 0.12); }
    .win-btns {
      display: flex;
      align-items: center;
      gap: 4px;
      -webkit-app-region: no-drag;
    }
    #win-min, #win-fs, #win-close {
      font-size: 13px;
      line-height: 1;
    }
    #win-close {
      color: #fecaca;
      background: rgba(248, 113, 113, 0.22);
      border-color: rgba(248, 113, 113, 0.4);
    }
    #win-close:hover { color: #fff; background: rgba(248, 113, 113, 0.4); }
    html.is-fullscreen .wrap { padding: 0; }
    html.is-fullscreen .panel { border-radius: 0; }
    #qa-btn, #sum-toggle { width: auto; padding: 0 8px; font-size: 11px; font-weight: 600; }
    #qa-btn {
      color: #8e8e93;
      background: rgba(142, 142, 147, 0.22);
      border-color: rgba(142, 142, 147, 0.35);
    }
    #qa-btn:hover { color: #d1d1d6; background: rgba(142, 142, 147, 0.32); }
    #qa-btn.on {
      color: #fff;
      background: var(--ok);
      border-color: var(--ok);
    }
    #qa-btn.on:hover { color: #fff; background: #24b84b; }
    #sum-btn {
      appearance: none;
      border: 0;
      border-radius: 8px;
      padding: 7px 12px;
      font: 12px/1 inherit;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: var(--save-fg);
      width: 100%;
    }
    #sum-btn:disabled { opacity: 0.6; cursor: default; }
    #summary {
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 5;
      width: 0;
      min-width: 0;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--bg);
      border-left: 0;
      box-shadow: none;
      -webkit-app-region: no-drag;
      flex: 0 0 auto;
      pointer-events: none;
      transition: width 0.2s ease;
    }
    #summary.open {
      width: min(280px, 46%);
      border-left: 1px solid var(--line);
      pointer-events: auto;
    }
    #summary .cfg-hd,
    #summary #sum-text,
    #summary .cfg-foot {
      min-width: 240px;
    }
    #sum-text {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 10px 12px;
      color: var(--text);
      font-size: 13px;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    #sum-text:empty::before {
      content: "No summary yet";
      color: var(--muted);
    }
    #sum-text.pending { color: var(--muted); }
    #dot { width: 8px; height: 8px; border-radius: 50%; background: #f87171; }
    #dot.on { background: #4ade80; }
    .cfg-backdrop {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 15;
      background: rgba(0, 0, 0, 0.28);
      -webkit-app-region: no-drag;
    }
    [data-theme="white"] .cfg-backdrop { background: rgba(0, 0, 0, 0.16); }
    .panel.cfg-open .cfg-backdrop { display: block; }
    #settings {
      display: flex;
      flex-direction: column;
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(300px, 88%);
      z-index: 20;
      margin: 0;
      padding: 0;
      background: var(--bg);
      border-left: 1px solid var(--line);
      box-shadow: -8px 0 24px rgba(0, 0, 0, 0.18);
      -webkit-app-region: no-drag;
      transform: translateX(100%);
      transition: transform 0.22s ease;
      pointer-events: none;
    }
    #settings.open {
      transform: translateX(0);
      pointer-events: auto;
    }
    .cfg-hd {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px 8px;
      border-bottom: 1px solid var(--line);
    }
    .cfg-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--title);
    }
    .cfg-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 4px 12px 10px;
    }
    .cfg-foot {
      padding: 8px 12px 12px;
      border-top: 1px solid var(--line);
    }
    .cfg-sec {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0 10px 8px;
      margin: 8px 0;
    }
    .cfg-sec summary {
      cursor: pointer;
      padding: 8px 0;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--title);
      list-style: none;
    }
    .cfg-sec summary::-webkit-details-marker { display: none; }
    .cfg-sec summary::after {
      content: "▸";
      float: right;
      color: var(--muted);
    }
    .cfg-sec[open] summary::after { content: "▾"; }
    #settings label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: var(--label);
      margin: 8px 0 4px;
    }
    #settings textarea {
      min-height: 72px;
      resize: vertical;
    }
    #settings input, #settings select, #settings textarea {
      width: 100%;
      box-sizing: border-box;
      background: var(--input);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 8px;
      padding: 7px 9px;
      font: 12px/1.4 inherit;
    }
    #cfg-conf-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #cfg-conf { flex: 1; padding: 0; }
    #cfg-conf-val {
      min-width: 2.6em;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }
    #settings .row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
    }
    #settings .row button {
      appearance: none;
      border: 0;
      border-radius: 8px;
      padding: 7px 12px;
      font: 12px/1 inherit;
      cursor: pointer;
    }
    #cfg-save { background: var(--accent); color: var(--save-fg); font-weight: 600; }
    #cfg-clear { background: var(--btn); color: var(--title); }
    .themes {
      display: flex;
      gap: 8px;
    }
    .theme-dot {
      appearance: none;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--line);
      padding: 0 10px;
      cursor: pointer;
      background: var(--btn);
      color: var(--text);
      font: 12px/1 inherit;
    }
    .theme-dot::before {
      content: "";
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--swatch);
      border: 1px solid var(--line);
    }
    .theme-dot[data-theme="black"] { --swatch: #1c1c1e; }
    .theme-dot[data-theme="white"] { --swatch: #f5f5f7; }
    .theme-dot.on { border-color: var(--accent); color: var(--accent); }
    #cfg-note { margin-top: 8px; font-size: 11px; color: var(--muted); min-height: 1.2em; }
    #current {
      padding: 10px 10px 8px;
      flex: 0 0 auto;
    }
    #history {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 0 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .qa-card {
      display: grid;
      grid-template-columns: 32px 1fr;
      gap: 4px 10px;
      padding: 12px 14px;
      border-radius: 10px;
      background: var(--card);
      position: relative;
    }
    .qa-card.current {
      background: var(--card-current);
      border-left: 3px solid var(--accent);
    }
    .qa-card:not(.current) { opacity: 0.7; }
    .qa-card.draft .a-text { color: var(--draft); }
    .q-label, .a-label {
      font-weight: 700;
      font-size: 13px;
      padding-top: 2px;
    }
    .q-label { color: var(--accent); }
    .a-label { color: var(--ok); }
    .q-text {
      color: var(--text);
      font-size: 14px;
      border-bottom: 1px solid var(--hairline);
      padding-bottom: 8px;
      margin-bottom: 8px;
    }
    .a-text {
      color: var(--text);
      font-size: 17px;
      line-height: 1.5;
    }
    .qa-badge {
      position: absolute;
      top: 8px;
      right: 34px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--muted);
      background: var(--chip);
      border-radius: 999px;
      padding: 2px 7px;
    }
    .qa-del {
      position: absolute;
      top: 6px;
      right: 8px;
      width: 22px;
      height: 22px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #64748b;
      font: 16px/1 inherit;
      cursor: pointer;
      padding: 0;
    }
    .qa-del:hover { color: #fecaca; background: rgba(248, 113, 113, 0.12); }
    .dots::after {
      content: ".";
      animation: dots 1s steps(3, end) infinite;
    }
    @keyframes dots {
      0% { content: "."; }
      33% { content: ".."; }
      66% { content: "..."; }
    }
    #tx-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 12px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
    }
    #tx-toggle {
      background: none;
      border: 0;
      color: var(--muted);
      cursor: pointer;
      font: inherit;
      padding: 0;
    }
    #tx-toggle:hover { color: var(--text); }
    #tx-last {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      opacity: 0.7;
    }
    #transcript {
      display: none;
      max-height: 22vh;
      overflow-y: auto;
      padding: 4px 12px 8px;
      border-top: 1px solid var(--line);
      font-size: 11px;
      line-height: 1.4;
      color: #64748b;
    }
    #transcript.open { display: block; }
    #transcript .t { opacity: 0.75; }
    #transcript .t.ext { color: var(--ext); opacity: 0.85; }
    footer {
      padding: 4px 12px 7px;
      color: var(--muted);
      font-size: 10px;
      border-top: 1px solid var(--line);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="panel">
      <header>
        <div class="hdr-left">
          <div class="win-btns">
            <button id="win-min" class="icon-btn" type="button" title="Minimize">─</button>
            <button id="win-fs" class="icon-btn" type="button" title="Full Screen">⛶</button>
            <button id="win-close" class="icon-btn" type="button" title="Close">×</button>
          </div>
        </div>
        <div class="hdr-actions">
          <button id="qa-btn" class="icon-btn" type="button" title="Q&A off">QA</button>
          <button id="sum-toggle" class="icon-btn" type="button" title="Summary">Summary</button>
          <button id="cfg-toggle" class="icon-btn" type="button" title="Settings">⚙</button>
          <span id="dot"></span>
        </div>
      </header>
      <div class="body">
        <div class="cfg-backdrop" id="cfg-backdrop"></div>
        <form id="settings" autocomplete="off" inert>
          <div class="cfg-hd">
            <div class="cfg-title">Config</div>
            <button id="cfg-close" class="icon-btn" type="button" title="Close">×</button>
          </div>
          <div class="cfg-scroll">
            <details class="cfg-sec" open>
              <summary>Appearance</summary>
              <label>Theme</label>
              <div id="cfg-themes" class="themes" role="group" aria-label="Theme">
                <button type="button" class="theme-dot" data-theme="black">Mac Black</button>
                <button type="button" class="theme-dot" data-theme="white">Light</button>
              </div>
            </details>
            <details class="cfg-sec">
              <summary>Q&amp;A</summary>
              <label for="cfg-llm">Model</label>
              <input id="cfg-llm" name="llm_model" type="text" spellcheck="false" />
              <label for="cfg-prompt">Prompt</label>
              <textarea id="cfg-prompt" name="prompt" spellcheck="true"></textarea>
            </details>
            <details class="cfg-sec">
              <summary>Summary</summary>
              <label for="cfg-sum-model">Model</label>
              <input id="cfg-sum-model" name="summary_model" type="text" spellcheck="false" />
              <label for="cfg-sum-prompt">Prompt</label>
              <textarea id="cfg-sum-prompt" name="summary_prompt" spellcheck="true"></textarea>
            </details>
            <details class="cfg-sec">
              <summary>Transcription</summary>
              <label for="cfg-whisper">Whisper model</label>
              <select id="cfg-whisper" name="whisper_model"></select>
              <label for="cfg-conf">Recognition confidence</label>
              <div id="cfg-conf-row">
                <input id="cfg-conf" name="recognition_confidence" type="range" min="0.30" max="0.95" step="0.01" />
                <span id="cfg-conf-val">0.70</span>
              </div>
            </details>
          </div>
          <div class="cfg-foot">
            <div class="row">
              <button id="cfg-clear" type="button">Clear all</button>
              <button id="cfg-save" type="submit">Save</button>
            </div>
            <div id="cfg-note"></div>
          </div>
        </form>
        <div class="main">
          <div id="current"></div>
          <div id="history"></div>
          <div id="tx-bar">
            <button id="tx-toggle" type="button">Transcript ▸</button>
            <span id="tx-last"></span>
          </div>
          <div id="transcript"></div>
          <footer id="lat"></footer>
        </div>
        <aside id="summary" inert>
          <div class="cfg-hd">
            <div class="cfg-title">Summary</div>
            <button id="sum-hide" class="icon-btn" type="button" title="Delete">×</button>
          </div>
          <div id="sum-text"></div>
          <div class="cfg-foot">
            <button id="sum-btn" type="button">Summarize</button>
          </div>
        </aside>
      </div>
    </section>
  </div>
  <script>
    const currentBox = document.getElementById("current");
    const historyBox = document.getElementById("history");
    const transcript = document.getElementById("transcript");
    const txToggle = document.getElementById("tx-toggle");
    const txLast = document.getElementById("tx-last");
    const lat = document.getElementById("lat");
    const dot = document.getElementById("dot");
    const panel = document.querySelector(".panel");
    const settings = document.getElementById("settings");
    const cfgToggle = document.getElementById("cfg-toggle");
    const cfgClose = document.getElementById("cfg-close");
    const cfgBackdrop = document.getElementById("cfg-backdrop");
    const winMin = document.getElementById("win-min");
    const winFs = document.getElementById("win-fs");
    const winClose = document.getElementById("win-close");
    const cfgLlm = document.getElementById("cfg-llm");
    const cfgWhisper = document.getElementById("cfg-whisper");
    const cfgNote = document.getElementById("cfg-note");
    const cfgClear = document.getElementById("cfg-clear");
    const cfgPrompt = document.getElementById("cfg-prompt");
    const cfgSumModel = document.getElementById("cfg-sum-model");
    const cfgSumPrompt = document.getElementById("cfg-sum-prompt");
    const cfgConf = document.getElementById("cfg-conf");
    const cfgConfVal = document.getElementById("cfg-conf-val");
    const cfgThemes = document.getElementById("cfg-themes");
    const qaBtn = document.getElementById("qa-btn");
    const sumToggle = document.getElementById("sum-toggle");
    const sumBtn = document.getElementById("sum-btn");
    const sumHide = document.getElementById("sum-hide");
    const summaryBox = document.getElementById("summary");
    const sumText = document.getElementById("sum-text");
    let current = null;
    let whisperDirty = false;
    const seenEv = new Set();
    let lastTx = "";
    let socket = null;
    let socketTimer = 0;
    const cards = new Map();
    const deletedAt = new Map();
    let sumWanted = false;
    let sumCleared = false;

    txToggle.addEventListener("click", () => {
      const open = transcript.classList.toggle("open");
      txToggle.textContent = open ? "Transcript ▾" : "Transcript ▸";
    });
    function setConfigOpen(open) {
      settings.classList.toggle("open", open);
      panel.classList.toggle("cfg-open", open);
      cfgToggle.classList.toggle("on", open);
      settings.inert = !open;
      if (open) {
        setSummaryOpen(false);
        loadConfig();
      }
    }
    function setSummaryOpen(open) {
      summaryBox.classList.toggle("open", open);
      panel.classList.toggle("sum-open", open);
      sumToggle.classList.toggle("on", open);
      summaryBox.inert = !open;
      if (window.copilot && typeof window.copilot.sidebar === "function") {
        window.copilot.sidebar(open);
      }
      if (open) {
        sumWanted = true;
        setConfigOpen(false);
      } else {
        sumWanted = false;
      }
    }
    cfgToggle.addEventListener("click", () => {
      setConfigOpen(!settings.classList.contains("open"));
    });
    cfgClose.addEventListener("click", () => setConfigOpen(false));
    cfgBackdrop.addEventListener("click", () => {
      setConfigOpen(false);
    });
    document.addEventListener("keydown", (e) => {
      if (e.key !== "Escape") return;
      setConfigOpen(false);
      setSummaryOpen(false);
    });
    qaBtn.addEventListener("click", () => setQaEnabled(!qaBtn.classList.contains("on")));
    sumToggle.addEventListener("click", () => {
      const open = !summaryBox.classList.contains("open");
      setSummaryOpen(open);
      if (open && !sumText.textContent.trim()) startSummary();
    });
    function setFullscreenUI(on) {
      document.documentElement.classList.toggle("is-fullscreen", !!on);
      winFs.textContent = on ? "⤢" : "⛶";
      winFs.title = on ? "Exit Full Screen" : "Full Screen";
    }
    winMin.addEventListener("click", () => {
      if (window.copilot && typeof window.copilot.minimize === "function") {
        window.copilot.minimize();
      }
    });
    winFs.addEventListener("click", () => {
      if (window.copilot && typeof window.copilot.toggleFullscreen === "function") {
        window.copilot.toggleFullscreen();
        return;
      }
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen?.();
    });
    winClose.addEventListener("click", () => {
      if (window.copilot && typeof window.copilot.quit === "function") {
        window.copilot.quit();
        return;
      }
      window.close();
    });
    if (window.copilot && typeof window.copilot.onFullscreen === "function") {
      window.copilot.onFullscreen(setFullscreenUI);
      if (typeof window.copilot.isFullscreen === "function") {
        window.copilot.isFullscreen().then(setFullscreenUI).catch(() => {});
      }
    }
    document.addEventListener("fullscreenchange", () => {
      setFullscreenUI(!!document.fullscreenElement);
    });
    settings.addEventListener("submit", (e) => {
      e.preventDefault();
      saveConfig();
    });
    cfgClear.addEventListener("click", () => {
      clearAllCards(true);
    });
    sumBtn.addEventListener("click", () => startSummary());
    sumHide.addEventListener("click", () => clearSummary());
    cfgConf.addEventListener("input", () => {
      cfgConfVal.textContent = Number(cfgConf.value).toFixed(2);
    });
    cfgThemes.addEventListener("click", (e) => {
      const btn = e.target.closest(".theme-dot");
      if (!btn) return;
      applyTheme(btn.dataset.theme, true);
      fetch("/api/config", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ theme: btn.dataset.theme }),
      }).catch(() => {});
    });

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }
    function fmtMs(ms) {
      if (ms == null || ms === "") return "";
      const n = Number(ms);
      if (!Number.isFinite(n)) return "";
      if (n < 0) return "prefetch";
      if (n >= 1000) return (n / 1000).toFixed(1) + "s";
      return Math.round(n) + "ms";
    }
    function badgeText(ev) {
      return fmtMs(ev.ext_ms != null ? ev.ext_ms : ev.ttft_ms);
    }
    function makeCard(isCurrent) {
      const el = document.createElement("div");
      el.className = "qa-card" + (isCurrent ? " current" : "");
      el.innerHTML =
        `<span class="qa-badge" hidden></span>` +
        `<button class="qa-del" type="button" title="Delete" aria-label="Delete">×</button>` +
        `<div class="q-label">Q</div><div class="q-text"></div>` +
        `<div class="a-label">A</div><div class="a-text"><span class="dots"></span></div>`;
      return el;
    }
    function fillCard(el, ev) {
      const draft = ev.kind === "draft" || ev.kind === "fast";
      el.classList.toggle("draft", draft);
      el.querySelector(".q-text").textContent = ev.question || "";
      const aEl = el.querySelector(".a-text");
      if (ev.answer) {
        aEl.textContent = ev.answer;
      } else {
        aEl.innerHTML = '<span class="dots"></span>';
      }
      const badge = el.querySelector(".qa-badge");
      const text = badgeText(ev);
      if (text) {
        badge.hidden = false;
        badge.textContent = text;
      }
    }
    function normQ(q) {
      return String(q || "").toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff]+/g, " ").trim();
    }
    function sameQuestion(prev, next) {
      const a = normQ(prev);
      const b = normQ(next);
      if (!a || !b) return !b;
      if (a === b) return true;
      const shorter = a.length <= b.length ? a : b;
      const longer = a.length <= b.length ? b : a;
      if (longer.startsWith(shorter) && shorter.length / Math.max(longer.length, 1) >= 0.85) return true;
      return false;
    }
    function rememberCard(card) {
      const key = normQ(card.q);
      if (key) cards.set(key, card);
    }
    function findCard(q) {
      const n = normQ(q);
      if (!n) return current;
      if (cards.has(n)) return cards.get(n);
      for (const [k, card] of cards) {
        if (sameQuestion(k, n)) return card;
      }
      if (current && sameQuestion(current.q, q)) return current;
      return null;
    }
    function archiveCurrent() {
      if (!current) return;
      current.el.classList.remove("current");
      historyBox.prepend(current.el);
      rememberCard(current);
      current = null;
    }
    function cardFromEl(el) {
      if (current && current.el === el) return current;
      for (const card of cards.values()) {
        if (card.el === el) return card;
      }
      return null;
    }
    function forgetCardKeys(card) {
      for (const [k, c] of [...cards]) {
        if (c === card) cards.delete(k);
      }
    }
    function recentlyDeleted(q) {
      const n = normQ(q);
      if (!n) return false;
      const t = deletedAt.get(n);
      if (!t) return false;
      if (Date.now() - t > 4000) {
        deletedAt.delete(n);
        return false;
      }
      return true;
    }
    function removeCard(card, notify) {
      if (!card) return;
      const q = card.q || "";
      if (normQ(q)) deletedAt.set(normQ(q), Date.now());
      forgetCardKeys(card);
      card.el.remove();
      if (current === card) {
        current = null;
        currentBox.replaceChildren();
      }
      if (notify) {
        fetch("/api/qa/delete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: q }),
        }).catch(() => {});
      }
    }
    function clearAllCards(notify) {
      for (const card of [...cards.values()]) removeCard(card, false);
      if (current) removeCard(current, false);
      cards.clear();
      currentBox.replaceChildren();
      historyBox.replaceChildren();
      if (notify) {
        fetch("/api/qa/delete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: "" }),
        }).catch(() => {});
      }
    }
    function setQaUI(on) {
      qaBtn.classList.toggle("on", !!on);
      qaBtn.title = on ? "Q&A on" : "Q&A off";
    }
    async function setQaEnabled(on) {
      setQaUI(on);
      try {
        const res = await fetch("/api/qa", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ enabled: !!on }),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
          setQaUI(!on);
          lat.textContent = body.error || "QA toggle failed";
          return;
        }
        if (body.qa_enabled != null) setQaUI(body.qa_enabled);
      } catch (e) {
        setQaUI(!on);
        lat.textContent = "QA toggle failed";
      }
    }
    function showSummary(text, pending) {
      if (sumCleared) return;
      sumText.classList.toggle("pending", !!pending);
      sumText.textContent = text || "";
      if (sumWanted) setSummaryOpen(true);
    }
    function clearSummary() {
      sumCleared = true;
      sumWanted = false;
      sumBtn.disabled = false;
      sumText.textContent = "";
      sumText.classList.remove("pending");
      setSummaryOpen(false);
      fetch("/api/summary/delete", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: "{}",
      }).catch(() => {});
    }
    async function startSummary() {
      sumCleared = false;
      sumWanted = true;
      sumBtn.disabled = true;
      showSummary("Starting summary…", true);
      try {
        const res = await fetch("/api/summary", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: "{}",
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
          showSummary(body.error || "Summary failed", false);
          sumBtn.disabled = false;
        }
      } catch (e) {
        showSummary("Summary failed", false);
        sumBtn.disabled = false;
      }
    }
    function applyTheme(name, persist) {
      const raw = String(name || "black").toLowerCase();
      const theme = raw === "white" || raw === "light" || raw === "mac-white" ? "white" : "black";
      document.documentElement.dataset.theme = theme;
      cfgThemes.querySelectorAll(".theme-dot").forEach((btn) => {
        btn.classList.toggle("on", btn.dataset.theme === theme);
      });
      if (persist) {
        try { localStorage.setItem("overlay-theme", theme); } catch (e) {}
      }
    }
    function fillConfig(cfg, preferServerTheme) {
      if (!cfg) return;
      if (cfg.theme && preferServerTheme) applyTheme(cfg.theme, true);
      if (cfg.llm_model) cfgLlm.value = cfg.llm_model;
      const opts = cfg.whisper_options || [];
      if (opts.length && cfgWhisper.options.length !== opts.length) {
        cfgWhisper.innerHTML = opts.map((m) => `<option value="${esc(m)}">${esc(m)}</option>`).join("");
      }
      if (cfg.whisper_model && !whisperDirty) cfgWhisper.value = cfg.whisper_model;
      if (cfg.prompt != null) cfgPrompt.value = cfg.prompt;
      if (cfg.summary_model) cfgSumModel.value = cfg.summary_model;
      if (cfg.summary_prompt != null) cfgSumPrompt.value = cfg.summary_prompt;
      if (cfg.recognition_confidence != null) {
        cfgConf.value = String(cfg.recognition_confidence);
        cfgConfVal.textContent = Number(cfg.recognition_confidence).toFixed(2);
      }
      cfgWhisper.disabled = !!cfg.whisper_loading;
      if (cfg.whisper_loading) cfgNote.textContent = "Loading Whisper " + cfg.whisper_model + "…";
      if (cfg.qa_enabled != null) setQaUI(cfg.qa_enabled);
    }
    async function loadConfig() {
      try {
        const res = await fetch("/api/config");
        const cfg = await res.json();
        fillConfig(cfg, !localStorage.getItem("overlay-theme"));
      } catch (e) {
        cfgNote.textContent = "Could not load settings";
      }
    }
    async function saveConfig() {
      cfgNote.textContent = "Saving…";
      try {
        const res = await fetch("/api/config", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            llm_model: cfgLlm.value.trim(),
            whisper_model: cfgWhisper.value,
            theme: document.documentElement.dataset.theme || "black",
            prompt: cfgPrompt.value,
            summary_model: cfgSumModel.value.trim(),
            summary_prompt: cfgSumPrompt.value,
            recognition_confidence: Number(cfgConf.value),
          }),
        });
        const cfg = await res.json();
        if (!res.ok) {
          cfgNote.textContent = cfg.error || "Save failed";
          return;
        }
        fillConfig(cfg, true);
        cfgNote.textContent = cfg.whisper_loading
          ? "Saved. Loading Whisper " + cfg.whisper_model + "…"
          : "Saved";
      } catch (e) {
        cfgNote.textContent = "Save failed";
      }
    }
    panel.addEventListener("click", (e) => {
      const btn = e.target.closest(".qa-del");
      if (!btn) return;
      e.preventDefault();
      removeCard(cardFromEl(btn.closest(".qa-card")), true);
    });
    function onEvent(ev) {
      if (ev.t != null) {
        const id = `${ev.t}:${ev.type}:${ev.label || ""}:${ev.text || ev.question || ""}`;
        if (seenEv.has(id)) return;
        seenEv.add(id);
        if (seenEv.size > 400) {
          const drop = [...seenEv].slice(0, 200);
          for (const key of drop) seenEv.delete(key);
        }
      }
      if (ev.type === "transcript") {
        const line = `${ev.ts}|${ev.label}|${ev.text || ""}`;
        if (line === lastTx) return;
        lastTx = line;
        const row = document.createElement("div");
        const ext = String(ev.label || "").startsWith("EXT");
        row.className = "t" + (ext ? " ext" : "");
        row.innerHTML = `<span>${esc(ev.ts)}</span> [${esc(ev.label)}] ${esc(ev.text)}`;
        transcript.appendChild(row);
        transcript.scrollTop = transcript.scrollHeight;
        txLast.textContent = `[${ev.label}] ${ev.text || ""}`;
      } else if (ev.type === "qa") {
        const draft = ev.kind === "draft" || ev.kind === "fast";
        const q = ev.question || "";
        if (recentlyDeleted(q)) return;
        let card = findCard(q);
        if (card) {
          if (q && normQ(q) !== normQ(card.q)) {
            cards.delete(normQ(card.q));
            card.q = q;
          } else if (q) {
            card.q = q;
          }
          rememberCard(card);
          fillCard(card.el, ev);
          if (ev.done && !draft) card.done = true;
          return;
        }
        if (current && q && current.q && !sameQuestion(current.q, q)) archiveCurrent();
        if (!current) {
          const el = makeCard(true);
          currentBox.replaceChildren(el);
          current = { el, q, done: false };
        }
        current.q = q || current.q;
        rememberCard(current);
        fillCard(current.el, ev);
        if (ev.done && !draft) current.done = true;
      } else if (ev.type === "lat") {
        lat.textContent = ev.text || "";
        if (current) {
          const badge = current.el.querySelector(".qa-badge");
          const text = badgeText(ev);
          if (text) {
            badge.hidden = false;
            badge.textContent = text;
          }
        }
      } else if (ev.type === "summary") {
        showSummary(ev.text || "", !ev.done);
        if (ev.done) sumBtn.disabled = false;
      } else if (ev.type === "summary_gone") {
        sumCleared = true;
        sumWanted = false;
        sumBtn.disabled = false;
        sumText.textContent = "";
        sumText.classList.remove("pending");
        setSummaryOpen(false);
      } else if (ev.type === "status") {
        if (!lat.textContent) lat.textContent = ev.text || "";
        if (settings.classList.contains("open") && ev.text) cfgNote.textContent = ev.text;
      } else if (ev.type === "config") {
        fillConfig(ev);
      } else if (ev.type === "qa_gone") {
        const q = ev.question || "";
        if (!q) {
          clearAllCards(false);
          return;
        }
        const card = findCard(q);
        if (card) removeCard(card, false);
      }
    }

    function connect() {
      if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) {
        return;
      }
      const proto = location.protocol === "https:" ? "wss" : "ws";
      const ws = new WebSocket(proto + "://" + location.host + "/ws");
      socket = ws;
      ws.onopen = () => { dot.classList.add("on"); };
      ws.onclose = () => {
        if (socket === ws) socket = null;
        dot.classList.remove("on");
        clearTimeout(socketTimer);
        socketTimer = setTimeout(connect, 800);
      };
      ws.onerror = () => ws.close();
      ws.onmessage = (m) => {
        try { onEvent(JSON.parse(m.data)); } catch (e) {}
      };
    }
    applyTheme(localStorage.getItem("overlay-theme") || "black", false);
    loadConfig();
    connect();
  </script>
</body>
</html>
